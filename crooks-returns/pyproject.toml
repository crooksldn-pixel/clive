[project]
name = "crooks-returns"
version = "0.1.0"
description = "CROOKS LDN returns and exchanges: customer portal backend, Shopify Returns, Click & Drop labels, CLIVE API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "tzdata>=2024.2",
]

[project.scripts]
returns-ctl = "returns.ctl:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["returns*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
