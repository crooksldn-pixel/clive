[project]
name = "clive-preorders"
version = "0.1.0"
description = "CLIVE Preorders: pre-orders against inbound stock, incoming stock and Notify me demand"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["preorders*"]

[tool.setuptools.package-data]
preorders = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# GraphQL documents are kept exactly as validated against the Admin schema.
"preorders/shopify.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
