[project]
name = "crooks-assistant"
version = "0.1.0"
description = "CROOKS LDN voice assistant — local-first, read-only, Claude Max subscription"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "av>=13.1",
  "rapidfuzz>=3.10",
  "jellyfish>=1.1",
  "claude-agent-sdk>=0.1.0",
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "keyring>=25.5",
  # Verifies the passkey on every change made from the Connections screen (app/connections/passkeys.py).
  # Already installed through google-auth; named here because CLIVE now imports it itself.
  "cryptography>=42",
  "python-dateutil>=2.9",
  "tzdata>=2024.2",
  # Reads the PDFs George gives CLIVE as research, in a process of its own (app/research/pdf_reader.py).
  # Pure Python, no system libraries. 6.19.0 carries the fix for every parser advisory published up
  # to 1 Oct 2026 (memory and runtime bombs since 6.0.0's CVE-2025-55197).
  "pypdf>=6.19.0",
]

[project.optional-dependencies]
# pyyaml is test-only: the CI workflow is now part of the repository's tested
# surface, and tests/test_ci_workflow.py parses it rather than grepping it.
# pypdf and reportlab are test-only too: tests/test_crooks_shipping_contract.py runs the CLIVE Shipping
# service's own code (tests/shipping_service.py), which reads and draws label PDFs with them. CLIVE
# itself never imports them, so the server needs neither.
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "pyyaml>=6.0", "pypdf>=6.0", "reportlab>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI dependency injection *requires* Depends/File/Form in argument defaults.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: hits a live external API (Shopify/Gmail); skipped without credentials",
]
