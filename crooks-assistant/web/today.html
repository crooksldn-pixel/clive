<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060607">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<title>CLIVE · Today</title>
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/today.css?b=__BUILD__">
</head>
<body data-who="loading">
<!-- The team's own CLIVE (web/today.js): CLIVE's orb and one line saying what happens next, the one
     job in hand in big type with one obvious action, and an ask bar on every screen that takes a
     tap, a sentence typed, or a sentence said while holding the button. The owner's side of the
     team (web/today-owner.js) is on the same page: who is on what, handing out, and people. -->
<main class="page" id="page">
  <header class="clive">
    <canvas id="orb" class="orb" width="96" height="96" aria-hidden="true"></canvas>
    <p id="line" class="line" role="status" aria-live="polite">Getting your work</p>
    <a class="home" id="home" href="/" hidden>Your CLIVE</a>
  </header>

  <section id="work" class="work" hidden>
    <article id="now" class="now" aria-live="polite"></article>
    <section id="after" class="after" aria-label="After this"></section>
    <section id="more" class="more"></section>
  </section>

  <section id="list" class="sheet" hidden aria-label="Every job"></section>

  <section id="talk" class="sheet talk" hidden aria-label="Talking to CLIVE">
    <div id="talk-log" class="talk-log"></div>
  </section>

  <section id="owner" class="owner" hidden>
    <nav id="segments" class="segments" aria-label="Team sections"></nav>
    <div id="owner-team" class="owner-part"></div>
    <div id="owner-hand" class="owner-part" hidden></div>
    <div id="owner-people" class="owner-part" hidden></div>
  </section>
</main>

<footer class="dock" id="dock">
  <div id="bar-slot" class="bar-slot"></div>
  <form id="ask" class="ask" autocomplete="off">
    <div class="ask-field">
      <p id="heard" class="heard" aria-live="polite" hidden></p>
      <input id="ask-text" type="text" enterkeyhint="send" maxlength="600" spellcheck="true"
             placeholder="Say what you did, or ask" aria-label="Tell CLIVE what you did, or ask">
    </div>
    <button id="send" class="send" type="submit" aria-label="Send" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <button id="mic" class="mic" type="button" aria-label="Hold to speak">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </form>
</footer>

<script src="/static/orb.js?b=__BUILD__" defer></script>
<script src="/static/objective-touch.js?b=__BUILD__" defer></script>
<script src="/static/today-say.js?b=__BUILD__" defer></script>
<script src="/static/today-voice.js?b=__BUILD__" defer></script>
<script src="/static/today.js?b=__BUILD__" defer></script>
<script src="/static/today-owner.js?b=__BUILD__" defer></script>
</body>
</html>
