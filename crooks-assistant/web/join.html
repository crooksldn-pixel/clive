<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060607">
<meta name="referrer" content="no-referrer">
<title>CLIVE · Join</title>
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/today.css?b=__BUILD__">
<link rel="stylesheet" href="/static/join.css?b=__BUILD__">
</head>
<body>
<!-- Joining CLIVE from a staff link (web/join.js, app/routes/staff_links.py, DEC-075): the link
     George sent carries its key after the #, which never leaves this phone except in the one POST
     below with the code he said. One box, one button, and a sentence that always says what next. -->
<main class="page join">
  <p class="join-kick">CLIVE · CROOKS</p>
  <h1 class="join-title" id="title">Join CLIVE</h1>
  <p class="join-line" id="line" role="status" aria-live="polite">Type the code George gave you.</p>
  <p class="join-note" id="in-app" hidden>This opened inside another app. Open it in Safari or Chrome first
    (the ••• menu, then Open in browser), or this phone won't stay signed in.</p>
  <form class="join-form" id="form" autocomplete="off" hidden>
    <label class="join-label" for="code">Code</label>
    <input class="field join-code" id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9 ]*" maxlength="7" enterkeyhint="go" required aria-describedby="line">
    <button class="go" id="go" type="submit">Join</button>
  </form>
  <p class="join-note" id="note" hidden>This signs in this phone only, as you. George can sign it out at any time.</p>
</main>
<script src="/static/join.js?b=__BUILD__" defer></script>
</body>
</html>
