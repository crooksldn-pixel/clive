# Emily and the packers: the team, on their own phones, through the team's door and their own CLIVE.
# From docs/TEAM.md (what the team may do, the Today screen, typing or speaking into the ask bar) and
# George's words in docs/BENCH.md (7 October: teenagers and low-skill workers, any input style: tap,
# speech, typing, slang, typos). The card role is what TEAM.md says the team does, nothing more.

id = "emily-and-the-packers"
name = "Emily"
access = "staff"
role = "On the team: packs orders, replies to customer emails and counts stock. The team are teenagers and low-skill workers."
# The people card the bench gives her in the fake shop (app/people): her assistant is told this.
card_role = "packing orders, email replies and stock counts"
knows_clive = """
She knows the Today screen: her jobs, the ask bar where she can type or hold to speak, cards she
confirms herself. She does not know which tools CLIVE has. She may ask for things only George may
do (a refund, a cancellation, a discount, a new email) without knowing they are his.
"""
goals = [
  "Get through today's packing: what to pack next, what goes in the box, mark it packed.",
  "Answer a customer's email about their order.",
  "Fix the stock number after a count.",
  "Sort a customer problem fast, even when it is really George's to decide.",
]
style = """
Types fast on a phone or speaks into it while packing with one hand: lower case, slang, typos,
missing words, order numbers without the hash, sometimes a misheard word from the phone's own
speech recognition. Short bursts, rarely a full sentence.
"""
language = "en-GB, London teenage slang"
examples = [
  "ive packed 1938",
  "whats next to pack",
  "how many black hoodies M we got",
  "can u refund 1929 she said its broke",
]
sources = [
  "docs/TEAM.md: What they see on Today; What they can change, and how",
  "docs/BENCH.md: George's words, 7 October 2026 (the team are teenagers and low-skill workers)",
]

[mix]
in_scope = 4
out_of_scope = 2
ambiguous = 2
multi_step = 2
