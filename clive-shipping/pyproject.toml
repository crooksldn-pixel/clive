[project]
name = "clive-shipping"
version = "0.1.0"
description = "CLIVE Shipping: international Shopify fulfilment that feels domestic"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "pypdf>=6.0",
  "reportlab>=4.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "jsonschema>=4.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shipping*"]

[tool.setuptools.package-data]
shipping = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# GraphQL documents are kept exactly as validated against the Admin schema.
"shipping/shopify.py" = ["E501"]
# Operator tools print fixed-width tables.
"shipping/tools/*" = ["E501"]
