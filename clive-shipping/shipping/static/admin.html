<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="shopify-api-key" content="{{CLIENT_ID}}">
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
<title>CLIVE Shipping</title>
<style>
  /* Layout gaps only: everything visible is a Polaris component. */
  body { margin: 0; }
  /* App Bridge shows s-app-nav in the admin sidebar; outside admin it would be bare links. */
  s-app-nav { display: none; }
  .nowrap { white-space: nowrap; }
  /* The stage tabs need room; on a phone the same choice is one select. */
  .stage-select { display: none; }
  @media (max-width: 700px) { .stage-tabs { display: none; } .stage-select { display: block; } }
  /* Selection boxes: Shopify-sized, and a fingertip's worth on touch screens. */
  input.pick { width: 16px; height: 16px; margin: 0; accent-color: #303030; cursor: pointer; }
  @media (pointer: coarse) { input.pick { width: 24px; height: 24px; } }
  .wrap-any { overflow-wrap: anywhere; }
  .order-cell { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  /* On a phone the bar stays one line (the header box already selects them all). */
  @media (max-width: 700px) { .wide-only { display: none; } }
</style>
</head>
<body>
<s-app-nav>
  <s-link href="/admin" rel="home">Home</s-link>
  <s-link href="/admin?section=returns">Returns</s-link>
  <s-link href="/shipping/admin">Shipping</s-link>
  <s-link href="/settings">Settings</s-link>
</s-app-nav>
<script>
// CROOKS Operations: Returns, Shipping and Settings are separate services under one embedded
// app. If App Bridge moves the URL to another section without loading it, load that section.
(() => {
  const at = (p) => p.replace(/\/+$/, "");
  const home = at(location.pathname);  // this section's page; its own routing keeps the path
  const check = () => { if (at(location.pathname) !== home) location.reload(); };
  for (const k of ["pushState", "replaceState"]) {
    const orig = history[k];
    history[k] = function (...args) { const r = orig.apply(this, args); check(); return r; };
  }
  addEventListener("popstate", check);
})();
</script>
<s-page id="page" heading="International shipping"><s-section><s-stack alignItems="center" padding="large"><s-spinner accessibilityLabel="Loading" size="large"></s-spinner></s-stack></s-section></s-page>

<script>
"use strict";
/*
 * CLIVE Shipping, embedded in Shopify admin. Three screens: the inbox, one shipment, Setup.
 *
 * Every call carries an App Bridge session token. Buying follows the preview → basis → buy
 * protocol: the confirmation shows the price the server checked, and the buy sends back that
 * preview's basis with an idempotency key made once per confirmation, so a double click or a
 * retry after a lost reply replays the same purchase instead of making another.
 */

const BASE = location.pathname.replace(/\/admin\/?$/, "");
const EMBEDDED = window.top !== window.self;
const STAGES = [
  ["attention", "Needs attention"],
  ["ready", "Ready to ship"],
  ["bought", "Labels bought"],
  ["printed", "Printed"],
  ["in_transit", "In transit"],
  ["delivered", "Delivered"],
  ["all", "All"],
];
const STAGE_KEYS = STAGES.map(([k]) => k);
const urlStage = () => {
  const s = new URLSearchParams(location.search).get("stage");
  return STAGE_KEYS.includes(s) ? s : "attention";
};
const state = { inbox: null, shipment: null, setup: null, preview: null, buyKey: null,
                batch: null, selected: new Set(), flash: null,
                q: new URLSearchParams(location.search).get("q") || "", busy: false };

// ------------------------------------------------------------------ helpers

const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

let regionNames = null;
try { regionNames = new Intl.DisplayNames(["en-GB"], { type: "region" }); } catch (e) { /* old browser */ }
const countryName = (iso) => (iso && regionNames ? regionNames.of(iso) : iso) || iso || "";
const flag = (iso) => /^[A-Z]{2}$/.test(iso || "")
  ? String.fromCodePoint(...[...iso].map((c) => 0x1f1a5 + c.charCodeAt(0))) : "";

async function token() {
  if (!EMBEDDED || !window.shopify || !shopify.idToken) return "";
  return await shopify.idToken();
}

class ApiError extends Error {
  constructor(status, detail) {
    const d = typeof detail === "object" && detail ? detail : { message: String(detail || "") };
    super(d.message || "Something went wrong.");
    this.status = status; this.code = d.code || ""; this.title = d.title || "";
    // CLIVE itself answered with a reason (not a proxy page or a dropped connection).
    this.fromClive = typeof detail === "object" && !!detail && !!detail.message;
  }
}

// Refusals that CLIVE gives before anything is sent to the provider: certainly nothing bought.
const BEFORE_BUYING = new Set(["stale", "shopify_unavailable", "provider_unavailable",
                               "provider_refused", "not_found"]);
function certainlyNotBought(err) {
  if (err.status === 401) return true;
  if (!err.fromClive || err.code === "busy") return false;
  return err.status < 500 || BEFORE_BUYING.has(err.code);
}

async function api(path, { method = "GET", body } = {}) {
  const headers = { Accept: "application/json" };
  const t = await token();
  if (t) headers.Authorization = `Bearer ${t}`;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  let res;
  try {
    res = await fetch(`${BASE}/admin/api${path}`, {
      method, headers, body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch (e) {
    throw new ApiError(0, { message: "The connection dropped before CLIVE answered.",
                            code: "network" });
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(res.status, data.detail);
  return data;
}

function toast(message, isError = false) {
  try { if (EMBEDDED && window.shopify?.toast) { shopify.toast.show(message, { isError }); return; } }
  catch (e) { /* fall through to the page banner */ }
  state.flash = { tone: isError ? "critical" : "success", heading: message, text: "" };
  render();
}

function loading(on) {
  state.busy = on;
  try { if (EMBEDDED && window.shopify?.loading) shopify.loading(on); } catch (e) { /* ignore */ }
}

function navigate(params, replace = false) {
  const qs = new URLSearchParams(params).toString();
  const url = `${BASE}/admin${qs ? "?" + qs : ""}`;
  (replace ? history.replaceState : history.pushState).call(history, {}, "", url);
  state.flash = null;
  route();
}

function badge(st) {
  return `<s-badge tone="${esc(st.tone)}">${esc(st.label)}</s-badge>`;
}

function banner(b) {
  if (!b) return "";
  const action = b.action
    ? `<s-button slot="secondary-actions" data-action="${esc(b.action)}">${esc(b.actionLabel)}</s-button>` : "";
  return `<s-banner tone="${esc(b.tone)}" heading="${esc(b.heading)}">${esc(b.text)}${action}</s-banner>`;
}

function errorBanner(err) {
  if (err.code === "stale") {
    return { tone: "critical", heading: err.title || "Order changed — refresh required",
             text: err.message, action: "refresh", actionLabel: "Refresh order" };
  }
  if (err.status === 401) {
    return { tone: "critical", heading: "Open CLIVE Shipping from Shopify admin",
             text: "Your Shopify session couldn't be checked. Open the app from the Apps menu." };
  }
  return { tone: "critical", heading: err.status === 503 ? "Couldn't reach a service" : "That didn't work",
           text: err.message };
}

// ------------------------------------------------------------------ routing

async function route() {
  const p = new URLSearchParams(location.search);
  const view = p.get("view");
  try {
    loading(true);
    if (p.get("batch")) {
      state.batch = await api(`/batches/${encodeURIComponent(p.get("batch"))}`);
      renderBatch();
    } else if (p.get("shipment")) {
      state.shipment = await api(`/shipments/${encodeURIComponent(p.get("shipment"))}`);
      renderShipment();
    } else if (view === "setup") {
      state.setup = await api("/setup");
      renderSetup();
    } else {
      state.inbox = await loadInbox();
      renderInbox();
    }
  } catch (err) {
    state.flash = errorBanner(err);
    page("CLIVE Shipping", "", `<s-section><s-paragraph>Nothing to show yet.</s-paragraph></s-section>`);
  } finally { loading(false); }
}

// One stage's orders; the search applies within it. Both live in the URL (?stage=, ?q=).
function loadInbox() {
  const q = state.q ? `&q=${encodeURIComponent(state.q)}` : "";
  return api(`/inbox?stage=${urlStage()}${q}`);
}
function keepSearchInUrl() {
  const p = new URLSearchParams(location.search);
  if (state.q) p.set("q", state.q); else p.delete("q");
  history.replaceState({}, "", `${BASE}/admin${p.toString() ? "?" + p : ""}`);
}

function render() {
  const p = new URLSearchParams(location.search);
  if (p.get("batch") && state.batch) renderBatch();
  else if (p.get("shipment") && state.shipment) renderShipment();
  else if (p.get("view") === "setup" && state.setup) renderSetup();
  else if (state.inbox) renderInbox();
}

let quoteFormDirty = false;
function page(heading, slots, body, aside = "") {
  quoteFormDirty = false;
  // One s-page for the whole app. New content is built detached and upgraded first, so each
  // component sees finished children when it connects (slots are checked on connect).
  const host = document.getElementById("page");
  const scratch = document.createElement("div");
  scratch.innerHTML = slots + (state.flash ? banner(state.flash) : "") + body +
    (aside ? `<s-box slot="aside">${aside}</s-box>` : "");
  if (window.customElements && customElements.upgrade) customElements.upgrade(scratch);
  host.setAttribute("heading", heading);
  host.replaceChildren(...scratch.childNodes);
  document.title = `${heading} · CLIVE Shipping`;
}

const localTime = at => at ? new Date(at).toLocaleString('en-GB') : '—';
function printBadge(p) {
  if (!p) return '—';
  return `<s-badge tone="${esc(p.tone)}">${esc(p.label)}${p.reprint_count ? ` · Reprints ×${p.reprint_count}` : ''}</s-badge>`;
}
function visibleInboxRows() {
  return state.inbox ? state.inbox.rows : [];
}
const batchMoney = b => {
  // UK labels have no price before buying: the total says so instead of counting them as £0.
  const unpriced = b.children.filter(c => c.state === 'review' && c.price_known === false).length;
  const total = new Intl.NumberFormat('en-GB', {style:'currency', currency:b.currency}).format(b.total_minor / 100);
  return unpriced ? `${total} + ${unpriced} UK label${unpriced === 1 ? '' : 's'} priced by Shopify Shipping` : total;
};
function renderBatch() {
  const b = state.batch;
  const ready = b.children.filter(c => c.state === 'review').length;
  const complete = b.children.filter(c => !['queued', 'running', 'review'].includes(c.state)).length;
  const slots = `<s-link slot="breadcrumb-actions" data-action="go-inbox" href="${BASE}/admin">Shipping</s-link>` +
    (b.state === 'review' && ready ? `<s-button slot="primary-action" variant="primary" data-action="confirm-batch">${b.kind === 'buy' ? 'Buy' : 'Print'} ${ready} labels</s-button>` : '');
  const rows = b.children.map((c,i) => `<s-table-row><s-table-cell>${i+1}. ${esc(c.order)}</s-table-cell><s-table-cell>${esc(c.provider || '—')} · ${esc(c.service || '—')}</s-table-cell><s-table-cell>${b.kind === 'buy' ? (c.price_known === false ? 'Set by Shopify Shipping' : new Intl.NumberFormat('en-GB',{style:'currency',currency:c.currency}).format(c.amount_minor/100)) : '1 first copy'}</s-table-cell><s-table-cell>${esc(c.state)}${c.message ? ` — ${esc(c.message)}` : ''}</s-table-cell></s-table-row>`).join('');
  const counts = Object.fromEntries(['purchased','printed','sent','failed','uncertain','excluded','skipped'].map(k => [k,b.children.filter(c => c.state === k).length]));
  page(b.state === 'review' ? 'Review selected labels' : 'Bulk operation progress', slots,
    `<s-section><s-stack gap="base"><s-text>${b.state === 'review' ? `${ready} ready to ${b.kind === 'buy' ? 'buy' : 'print'}${b.children.length > ready ? ` · ${b.children.length - ready} changed since you selected them (not included)` : ''}` : `${complete} / ${b.children.length} completed`} · ${b.kind === 'buy' ? `Total ${batchMoney(b)}` : 'Print order is shown below.'}</s-text><s-text>${b.state === 'review' ? 'Review the exclusions and each provider/service before confirming. No action has run yet.' : (b.kind === 'buy' ? `${counts.purchased} purchased` : `${counts.printed} printed · ${counts.sent} printing`) + ` · ${counts.failed} failed · ${counts.uncertain} uncertain · ${counts.excluded+counts.skipped} excluded/skipped`}</s-text><s-text color="subdued">Each order is independent. Uncertain outcomes are not automatically retried.</s-text><s-table><s-table-header-row><s-table-header>Order</s-table-header><s-table-header>Service</s-table-header><s-table-header>Price / copies</s-table-header><s-table-header>Outcome</s-table-header></s-table-header-row><s-table-body>${rows}</s-table-body></s-table></s-stack></s-section>`);
}
async function reviewSelected(kind) {
  const ids = visibleInboxRows().filter(r => state.selected.has(r.id)).map(r => r.id);
  if (!ids.length) return;
  const storage = `crooks-bulk-review:${kind}:${ids.join(',')}`;
  let key = sessionStorage.getItem(storage);
  if (!key) { key = crypto.randomUUID(); sessionStorage.setItem(storage, key); }
  const b = await api('/batches/preview', {method:'POST', body:{kind, shipment_ids:ids, idempotency_key:key}});
  sessionStorage.removeItem(storage);
  state.selected.clear(); navigate({batch:b.id});
}
let batchPollPending = false;
async function pollBatch() {
  const bid = new URLSearchParams(location.search).get('batch');
  if (!bid || state.batch?.id !== bid || state.batch.state !== 'queued' || batchPollPending || state.busy) return;
  batchPollPending = true;
  try { const b = await api(`/batches/${encodeURIComponent(bid)}`);
    if (new URLSearchParams(location.search).get('batch') === bid) { state.batch=b; renderBatch(); }
  } catch (_) { /* Durable progress can be read again, never resubmit. */ }
  finally { batchPollPending=false; }
}
setInterval(() => { void pollBatch(); }, 2000);

// ------------------------------------------------------------------ inbox

// When the customer ordered, in the store's time zone, as Shopify's order list says it:
// "Today at 13:06", "Yesterday at 22:01", "Monday at 16:49", then "7 Oct" (and the year if older).
function purchasedText(iso, tz) {
  if (!iso) return "—";
  const at = new Date(iso);
  if (Number.isNaN(at.getTime())) return "—";
  let zone = tz || "Europe/London";
  try { new Intl.DateTimeFormat("en-GB", { timeZone: zone }); } catch { zone = "Europe/London"; }  // a zone this browser doesn't know
  const day = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: zone, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  const time = new Intl.DateTimeFormat("en-GB", { timeZone: zone, hour: "2-digit", minute: "2-digit" }).format(at);
  const days = Math.round((Date.parse(day(new Date())) - Date.parse(day(at))) / 86400000);
  if (days === 0) return `Today at ${time}`;
  if (days === 1) return `Yesterday at ${time}`;
  if (days > 1 && days < 7) return `${new Intl.DateTimeFormat("en-GB", { timeZone: zone, weekday: "long" }).format(at)} at ${time}`;
  const sameYear = day(at).slice(0, 4) === day(new Date()).slice(0, 4);
  return new Intl.DateTimeFormat("en-GB", { timeZone: zone, day: "numeric", month: "short", ...(sameYear ? {} : { year: "numeric" }) }).format(at);
}

// What bulk action this tab offers, and which rows may take it (the server says, per row).
function bulkPick(ib) {
  if (ib.stage === "ready") return { flag: "can_buy", noun: "ready", action: "bulk-buy", label: "Buy labels — review" };
  if (ib.stage === "bought") return { flag: "can_first_print", noun: "unprinted", action: "bulk-print",
    label: ib.print_method === "printnode" ? "Print labels — review" : "Print labels" };
  return null;
}

function inboxTable(rows, pick) {
  const body = rows.map((r) => {
    const extra = r.status.reasons.filter((x) => x !== r.status.label);
    const reasons = extra.length && r.stage === "attention"
      ? `<s-text color="subdued">${esc(extra.join(" · "))}</s-text>` : "";
    const box = pick && r[pick.flag]
      ? `<input type="checkbox" class="pick" aria-label="Select ${esc(r.order)}" data-select="${esc(r.id)}" ${state.selected.has(r.id) ? "checked" : ""}>` : "";
    return `<s-table-row>
      <s-table-cell><span class="order-cell">${box}<s-link id="open-${esc(r.id)}" data-open="${esc(r.id)}">${esc(r.order)}</s-link></span></s-table-cell>
      <s-table-cell>${esc(purchasedText(r.purchased_at, state.inbox?.timezone))}</s-table-cell>
      <s-table-cell><span class="wrap-any">${esc(r.customer)}</span></s-table-cell>
      <s-table-cell>${flag(r.destination.country)} ${esc(countryName(r.destination.country))}${r.destination.city ? `<s-text color="subdued"> · ${esc(r.destination.city)}</s-text>` : ""}</s-table-cell>
      <s-table-cell><s-stack gap="small-100"><s-text>${esc(r.shipping)}</s-text><s-text color="subdued">${esc(r.package)}</s-text></s-stack></s-table-cell>
      <s-table-cell><s-stack gap="small-200">${badge(r.status)}${reasons}</s-stack></s-table-cell>
      <s-table-cell>${printBadge(r.print_status)}</s-table-cell>
    </s-table-row>`;
  }).join("");
  return `<s-table>
    <s-table-header-row>
      <s-table-header listSlot="primary">Order</s-table-header>
      <s-table-header listSlot="kicker">Purchased</s-table-header>
      <s-table-header listSlot="secondary">Customer</s-table-header>
      <s-table-header listSlot="labeled">Destination</s-table-header>
      <s-table-header listSlot="labeled">Shipping</s-table-header>
      <s-table-header listSlot="inline">Status</s-table-header>
      <s-table-header listSlot="inline">Label</s-table-header>
    </s-table-header-row>
    <s-table-body>${body}</s-table-body>
  </s-table>`;
}

// The selection bar sits in the list's own header and keeps its height whether or not anything
// is selected, so ticking the first row moves nothing.
// At most this many in one bulk action (the server refuses more).
const PICK_MAX = 100;
const pickedState = (eligible) => {
  const chosen = eligible.filter((r) => state.selected.has(r.id)).length;
  const full = Math.min(eligible.length, PICK_MAX);
  return { chosen, all: full > 0 && chosen >= full, some: chosen > 0 && chosen < full };
};

function bulkBar(pick) {
  const rows = visibleInboxRows();
  const eligible = rows.filter((r) => r[pick.flag]);
  const chosen = eligible.filter((r) => state.selected.has(r.id));
  const { all } = pickedState(eligible);
  const head = `<input type="checkbox" id="pick-all" class="pick" aria-label="Select all ${esc(pick.noun)} orders shown" ${all ? "checked" : ""} ${eligible.length ? "" : "disabled"}>`;
  const text = chosen.length
    ? `${chosen.length} selected${chosen.length >= PICK_MAX ? ` (up to ${PICK_MAX} at a time)` : ""}`
    : `${eligible.length} ${pick.noun}`;
  const selectAll = eligible.length > PICK_MAX ? `Select the first ${PICK_MAX} ${esc(pick.noun)}` : `Select all ${eligible.length} ${esc(pick.noun)}`;
  const more = chosen.length && !all
    ? `<span class="wide-only"><s-button variant="tertiary" data-action="select-stage">${selectAll}</s-button></span>` : "";
  const acts = chosen.length
    ? `${more}<s-button variant="primary" data-action="${pick.action}">${esc(pick.label)}</s-button><s-button variant="tertiary" data-action="clear-selection">Clear</s-button>`
    : (eligible.length ? `<s-button variant="tertiary" data-action="select-stage">Select all ${esc(pick.noun)}</s-button>` : "");
  return `<s-stack direction="inline" gap="small-300" alignItems="center">${head}<s-text type="strong">${text}</s-text>${acts}</s-stack>`;
}

// Ticking a box redraws only the bar and the boxes, never the page.
function refreshSelection() {
  const pick = state.inbox && bulkPick(state.inbox);
  const bar = document.getElementById("bulk-bar");
  if (!pick || !bar) return renderInbox();
  bar.innerHTML = bulkBar(pick);
  const head = document.getElementById("pick-all");
  if (head) head.indeterminate = pickedState(visibleInboxRows().filter((r) => r[pick.flag])).some;
  document.querySelectorAll("input[data-select]").forEach((x) => { x.checked = state.selected.has(x.dataset.select); });
}

const EMPTY = {
  attention: ["Nothing needs you", "Orders that can't ship yet appear here, with every reason at once."],
  ready: ["Nothing ready to ship", "Paid orders with every detail and a service appear here."],
  bought: ["No labels waiting", "Bought labels that haven't gone to the printer appear here."],
  printed: ["Nothing printed and waiting", "Printed labels stay here until the carrier has them."],
  in_transit: ["Nothing in transit", "Parcels the carrier has scanned appear here."],
  delivered: ["Nothing delivered yet", "Parcels the carrier reports delivered appear here."],
  all: ["No international orders", "Orders going abroad appear here by themselves, checked and priced."],
};

function stageTabs(ib) {
  const current = ib.stage;
  const select = `<s-select class="stage-select" id="stage-select" label="Show">${STAGES.map(([k, l]) =>
    `<s-option value="${k}" ${k === current ? "selected" : ""}>${esc(l)}${k === "all" ? "" : ` (${ib.counts[k] ?? 0})`}</s-option>`).join("")}</s-select>`;
  return select + `<s-button-group class="stage-tabs" gap="none" accessibilityLabel="Order stage">${STAGES.map(([k, l]) => {
    const n = k === "all" ? "" : ` (${ib.counts[k] ?? 0})`;
    const on = k === current;
    return `<s-button slot="secondary-actions" data-stage="${k}" ${on ? 'icon="check"' : ""}
      ${on ? 'aria-current="page"' : ""} href="${BASE}/admin?stage=${k}">${esc(l)}${n}</s-button>`;
  }).join("")}</s-button-group>`;
}

function renderInbox() {
  const ib = state.inbox;
  const stage = ib.stage;
  const rows = visibleInboxRows();
  // Bulk actions only where they make sense: buy from Ready, first print from Labels bought.
  const pick = bulkPick(ib);
  // Selection only ever holds rows on screen that may take this tab's action.
  for (const id of [...state.selected]) {
    if (!pick || !rows.some((r) => r.id === id && r[pick.flag])) state.selected.delete(id);
  }
  const slots =
    `<s-button slot="secondary-actions" data-action="sync">Check Shopify for orders</s-button>` +
    `<s-button slot="secondary-actions" data-action="go-setup">Setup</s-button>`;
  let top = "";
  if (!ib.setup.package) {
    top += banner({ tone: "info", heading: "Add the package you ship in",
      text: "CLIVE needs its size and empty weight once, then uses it for every order.",
      action: "go-setup", actionLabel: "Open Setup" });
  }
  const filters = `<s-section>
    <s-stack gap="base">
      ${stageTabs(ib)}
      <s-search-field id="search" label="Search ${esc(STAGES.find(([k]) => k === stage)[1].toLowerCase())}" labelAccessibilityVisibility="exclusive"
        placeholder="Search by order number, name or city" value="${esc(state.q)}"></s-search-field>
    </s-stack>
  </s-section>`;
  let body;
  if (!rows.length) {
    const [h, p] = state.q ? ["No orders match that search", "Try the order number on its own, e.g. 2145."]
      : (stage === "all" && ib.domestic ? ["No orders", "UK and international orders appear here by themselves, checked and ready to buy."] : EMPTY[stage]);
    body = `<s-section accessibilityLabel="No orders">
      <s-stack alignItems="center" gap="base" padding="large">
        <s-heading>${h}</s-heading><s-paragraph color="subdued">${p}</s-paragraph>
      </s-stack></s-section>`;
  } else {
    const bar = pick && rows.some((r) => r[pick.flag])
      ? `<s-box id="bulk-bar" paddingInline="base" paddingBlock="small-200">${bulkBar(pick)}</s-box>` : "";
    body = `<s-section padding="none">${bar}${inboxTable(rows, pick)}</s-section>`;
  }
  const recent = (ib.batches || []).length ? `<s-section heading="Recent bulk operations">${ib.batches.map(b => `<s-link href="${BASE}/admin?batch=${esc(b.id)}">${esc(b.kind === 'buy' ? 'Label purchase' : 'Label print')} · ${esc(b.state)} · ${esc(new Date(b.created_at).toLocaleString('en-GB'))}</s-link><br>`).join('')}</s-section>` : '';
  page(ib.domestic ? "Shipping" : "International shipping", slots, top + filters + body + recent);
  const head = document.getElementById("pick-all");
  if (head && pick) head.indeterminate = pickedState(rows.filter((r) => r[pick.flag])).some;
}

// ------------------------------------------------------------------ one shipment

function questionForm(q, i) {
  const id = `q${i}`;
  let fields = "", save = `<s-button data-action="answer" data-q="${i}">Save</s-button>`;
  if (q.kind === "customs") {
    const hint = q.suggestion
      ? `<s-paragraph color="subdued">Used for your other ${esc(q.choices[0] || "products")}: ${esc(q.suggestion)}. Check it before saving.</s-paragraph>` : "";
    fields = `${hint}<s-grid gridTemplateColumns="1fr 2fr" gap="base">
      <s-text-field id="${id}-hs" label="HS code" placeholder="e.g. 6109.10" value="${esc(usedCode(id, q.subject) || "")}"></s-text-field>
      <s-text-field id="${id}-desc" label="Customs description" value="${esc(q.choices[0] || "")}"></s-text-field>
    </s-grid>${codeFinder(id, q.subject, q.choices[0] || "")}`;
    if (q.suggestion) save = `<s-button data-action="use-suggestion" data-q="${i}">Use ${esc(q.suggestion)}</s-button>` + save;
  } else if (q.kind === "origin") {
    const used = q.choices || [];
    const all = [...used, ...ORIGINS.filter((c) => !used.includes(c))];
    fields = `<s-select id="${id}-country" label="Country of origin" placeholder="Choose where it's made">
      ${all.map((c) => `<s-option value="${c}">${esc(countryName(c))}</s-option>`).join("")}
    </s-select>`;
  } else if (q.kind === "weight") {
    fields = `<s-number-field id="${id}-grams" label="Weight of one item" suffix="g" min="1" max="30000" step="1" inputMode="numeric"></s-number-field>`;
  } else if (q.kind === "package") {
    fields = packageFields(id);
  } else if (q.kind === "second_label") {
    save = `<s-button data-action="answer" data-q="${i}">It's a second parcel</s-button>`;
  } else if (q.kind === "label_check") {
    // Only a person who has looked in Shopify admin can say there's no label.
    const id = state.shipment.order_admin_id;
    save = (id ? `<s-button href="shopify://admin/orders/${esc(id)}" target="_top">Open the order in Shopify</s-button>` : "") +
      `<s-button data-action="answer" data-q="${i}">No label in Shopify: allow buying</s-button>`;
  } else if (q.kind === "domestic_service") {
    // Only for this order; which checkout delivery method gets which service is set on the server.
    save = `<s-button data-action="answer" data-q="${i}" data-service="tracked_24">Tracked 24</s-button>
      <s-button data-action="answer" data-q="${i}" data-service="tracked_48">Tracked 48</s-button>`;
  } else {
    save = q.kind === "address" && state.shipment.order_admin_id
      ? `<s-button href="shopify://admin/orders/${esc(state.shipment.order_admin_id)}" target="_top">Open the order in Shopify</s-button>`
      : `<s-button data-action="refresh">Check again</s-button>`;
  }
  return `<s-box padding="base" border="base" borderRadius="base">
    <s-stack gap="base">
      <s-stack direction="inline" gap="small-200" alignItems="center"><s-badge tone="${esc(q.tone)}">${esc(q.phrase)}</s-badge></s-stack>
      <s-paragraph>${esc(q.text)}</s-paragraph>
      ${fields}
      <s-stack direction="inline" gap="base">${save}</s-stack>
    </s-stack></s-box>`;
}

function packageFields(id) {
  return `<s-grid gridTemplateColumns="2fr 1fr 1fr 1fr 1fr" gap="base">
    <s-text-field id="${id}-name" label="Name" placeholder="e.g. Mailer bag"></s-text-field>
    <s-number-field id="${id}-l" label="Length" suffix="cm" min="1" max="200"></s-number-field>
    <s-number-field id="${id}-w" label="Width" suffix="cm" min="1" max="200"></s-number-field>
    <s-number-field id="${id}-h" label="Height" suffix="cm" min="1" max="200"></s-number-field>
    <s-number-field id="${id}-g" label="Empty weight" suffix="g" min="1" max="5000"></s-number-field>
  </s-grid>`;
}

const ORIGINS = ["PT", "CN", "TR", "GB", "IN", "BD", "PK", "VN", "IT", "ES", "LK", "KH", "ID",
  "MA", "TN", "RO", "BG", "PL", "LT", "MK", "EG", "MX", "US", "DE", "FR", "NL", "TH", "MY",
  "KR", "JP", "TW", "MM"];

function optionLine(o, label, choosable = true) {
  const days = o.days ? ` · ${esc(o.days)}` : "";
  const use = o.chosen ? `<s-badge tone="success">Selected</s-badge>`
    : (choosable ? `<s-button variant="tertiary" data-action="choose" data-code="${esc(o.code)}">Use this</s-button>` : "");
  return `<s-grid gridTemplateColumns="1fr auto" gap="base" alignItems="center">
    <s-stack gap="small-300">
      <s-text type="strong">${label ? esc(label) + ": " : ""}${esc(o.title)} — ${esc(o.price)}</s-text>
      <s-text color="subdued">${esc(o.paperwork)}${days}${o.reason ? " · " + esc(o.reason.replace(/^Recommended: /, "").replace(/^./, (c) => c.toUpperCase())) : ""}</s-text>
      <s-text color="subdued">${[o.tracked === true ? "Tracked" : o.tracked === false ? "Untracked" : "", o.handover, o.provider ? "via " + o.provider : ""].filter(Boolean).map(esc).join(" · ")}</s-text>
    </s-stack>${use}</s-grid>`;
}

function renderShipment() {
  const d = state.shipment;
  const acts = new Set(d.actions);
  const chosen = d.shipping.chosen;
  let primary = "";
  // A UK label has no price before buying (Shopify Shipping): never a made-up amount.
  const priced = chosen && chosen.price_known !== false;
  if (acts.has("buy") && chosen) {
    primary = `<s-button slot="primary-action" variant="primary" data-action="preview">${priced ? `Buy label — ${esc(chosen.price)}` : "Buy label"}</s-button>`;
  } else if (acts.has("preview") && chosen && !d.buy_authorised) {
    // Not authorised to buy yet: the full preview still runs, nothing can be bought.
    primary = `<s-button slot="primary-action" variant="primary" data-action="preview">${priced ? `Check price — ${esc(chosen.price)}` : "Check label"}</s-button>`;
  } else if (acts.has("retry_shopify")) {
    primary = `<s-button slot="primary-action" variant="primary" data-action="retry-shopify">Retry Shopify update</s-button>`;
  } else if ((acts.has("print") || acts.has("reprint")) && !["in_transit", "delivered"].includes(d.stage)) {
    // The carrier already has a moving or delivered parcel: printing isn't the next step
    // (an explicit Reprint stays under the secondary actions).
    primary = `<s-button slot="primary-action" variant="primary" data-action="${printAction(d, false)}">${d.print_status?.first_print_available === false ? "Reprint label" : "Print label"}</s-button>`;
  }
  const reprintButton = (acts.has("print") || acts.has("reprint")) && !primary.includes('data-action="' + printAction(d, false) + '"') && !primary.includes('data-action="physical-reprint"') ?
    `<s-button slot="secondary-actions" data-action="${printAction(d, true)}">Reprint</s-button>` : "";
  const statusButton = d.print_method === "printnode" && d.print_status?.job_id ?
    `<s-button slot="secondary-actions" data-action="print-status">Check print status</s-button>` : "";
  const slots = statusButton + reprintButton + `<s-link slot="breadcrumb-actions" data-action="go-inbox" href="${BASE}/admin">Shipping</s-link>` +
    primary +
    (acts.has("refresh") ? `<s-button slot="secondary-actions" data-action="refresh">Refresh from Shopify</s-button>` : "") +
    (acts.has("retry_shopify") ? `<s-button slot="secondary-actions" data-action="${printAction(d, false)}">Print label</s-button>` : "") +
    (acts.has("cancel_label") ? `<s-button slot="secondary-actions" tone="critical" commandFor="cancel-modal" command="--show">Cancel label</s-button>` : "");

  // Problems first.
  let top = `<s-stack direction="inline" gap="small-200" alignItems="center">${badge(d.status)}</s-stack>`;
  if (d.status.label === "Purchase requires reconciliation") {
    top += banner({ tone: "critical", heading: "Purchase requires reconciliation",
      text: d.error || `CLIVE is confirming with ${d.provider || "the provider"} whether this label was paid. Don't buy it again.` });
  } else if (d.status.label === "Label purchased — Shopify update needs retry") {
    top += banner({ tone: "critical", heading: "Label purchased — Shopify update needs retry",
      text: d.error || "The label is bought. Only Shopify needs updating.",
      action: "retry-shopify", actionLabel: "Retry Shopify update" });
  } else if (d.error && !["Fulfilled"].includes(d.status.label) && !d.questions.some((q) => q.text === d.error)) {
    top += banner({ tone: "warning", heading: "Last attempt", text: d.error });
  }
  for (const a of d.alerts) top += banner({ tone: "warning", heading: "Check this order", text: a });
  if (!d.buy_authorised && acts.has("preview")) {
    top += banner({ tone: "info", heading: "Buying is not authorised for this order",
      text: `You can check everything${d.domestic ? "" : " and see the exact price"}. A label can only be bought once the owner authorises this order on the server.` });
  }

  let main = top;
  if (d.questions.length) {
    const n = d.questions.filter((q) => q.is_detail).length;
    const heading = n ? `${n} detail${n === 1 ? "" : "s"} needed` : d.status.label;
    main += `<s-section heading="${esc(heading)}">
      <s-stack gap="base">${d.questions.map(questionForm).join("")}</s-stack></s-section>`;
  }

  if (d.journey) main += journeySection(d);
  if (d.label) {
    const l = d.label;
    const steps = d.steps.map((s) =>
      `<s-stack direction="inline" gap="small-200" alignItems="center">
        <s-icon type="${s.done ? "check-circle" : "clock"}" tone="${s.done ? "success" : "neutral"}"></s-icon>
        <s-text ${s.done ? "" : 'color="subdued"'}>${esc(s.label)}</s-text></s-stack>`).join("");
    const docs = l.documents.filter((x) => x.must_print).map((x) =>
      `<s-stack gap="small-300"><s-stack direction="inline" gap="small-200" alignItems="center"><s-text>${esc(x.title)}</s-text>
        <s-text color="subdued">${x.page_size === "4x6" ? "4×6 label printer" : `${esc(x.page_size === "other" ? "Not 4×6" : x.page_size)}${x.copies > 1 ? ` · ${x.copies} copies` : ""}`}</s-text>
        ${x.pdf === false ? "" : `<s-button variant="tertiary" data-action="open-doc" data-doc="${esc(x.artifact_id)}">Open PDF</s-button>`}</s-stack>
        ${x.note ? `<s-text color="subdued">${esc(x.note)}</s-text>` : ""}</s-stack>`).join("");
    main += `<s-section heading="Label purchased">
      <s-stack gap="base">
        <s-grid gridTemplateColumns="1fr 1fr" gap="base">
          <s-stack gap="small-300"><s-text color="subdued">Service</s-text><s-text>${esc(l.carrier)} ${esc(l.service)} · ${esc(l.price)}</s-text></s-stack>
          <s-stack gap="small-300"><s-text color="subdued">Tracking</s-text>${l.tracking
            ? (/^https:\/\//i.test(l.tracking_url || "") ? `<s-link href="${esc(l.tracking_url)}" target="_blank">${esc(l.tracking)}</s-link>` : `<s-text>${esc(l.tracking)}</s-text>`)
            : `<s-text color="subdued">Waiting for the carrier</s-text>`}</s-stack>
        </s-grid>
        <s-stack gap="small-200">${steps}</s-stack>
        ${l.file_note ? "" : printCard(d)}
        <s-divider></s-divider>
        <s-stack gap="small-200"><s-heading>Documents</s-heading>${docs || (l.file_note ? '<s-text>No label file here: print it from the order in Shopify admin.</s-text>' : '<s-text color="subdued">Fetching the label file…</s-text>')}
          <s-text color="subdued">Reprinting uses the same label; nothing is bought.</s-text></s-stack>
      </s-stack></s-section>`;
  } else if (d.domestic) {
    // UK: the one service the owner's mapping (or a person) chose, from Shopify Shipping. No
    // alternatives and no price to show before buying. Until a service is chosen, the question
    // above says everything.
    const u = d.domestic;
    if (u.service) main += `<s-section heading="Shipping">
      <s-stack gap="small-300">
        <s-text type="strong">${esc(u.service)} · via ${esc(u.provider)}</s-text>
        <s-text color="subdued">${[u.days, "Tracked", "No customs (UK parcel)"].filter(Boolean).map(esc).join(" · ")}</s-text>
        <s-text color="subdued">${esc(u.why)}</s-text>
        <s-text color="subdued">${esc(u.price_note)}</s-text>
      </s-stack></s-section>`;
  } else if (d.shipping.chosen && !acts.has("service")) {
    // Being bought or checked: show what was chosen, offer no changes.
    main += `<s-section heading="Shipping">${optionLine(d.shipping.chosen, "", false)}</s-section>`;
  } else if (d.shipping.recommended) {
    const sh = d.shipping;
    const extra = [];
    if (sh.cheapest) extra.push(optionLine(sh.cheapest, "Cheapest"));
    if (sh.fastest) extra.push(optionLine(sh.fastest, "Fastest"));
    const chosenIsRec = chosen && chosen.code === sh.recommended.code;
    main += `<s-section heading="Shipping">
      <s-stack gap="base">
        ${(sh.provider_failures || []).map(f => `<s-banner tone="${f.actionable ? "warning" : "info"}"><strong>${esc(f.provider)} ${f.retryable ? 'temporarily unavailable' : 'couldn’t quote this shipment'} · ${esc(new Date(f.occurred_at).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'}))}</strong><p>${esc(f.safe_message)}</p>${f.fields.length ? `<p>Check: ${esc(f.fields.join(", "))}</p>` : ""}<p>${sh.options.length ? "Other provider rates remain available below." : "Refresh rates after resolving the issue."}</p></s-banner>`).join("")}
        ${chosenIsRec ? "" : (chosen ? optionLine(chosen, "Your choice") : "")}
        ${optionLine(sh.recommended, "Recommended")}
        ${extra.join("")}
        ${sh.options.length > 1 ? `<s-stack direction="inline"><s-button variant="tertiary" commandFor="services-modal" command="--show">See other services (${sh.options.length})</s-button></s-stack>` : ""}
      </s-stack></s-section>`;
  }

  // Package
  if (d.package) {
    main += `<s-section heading="Package">
      <s-grid gridTemplateColumns="1fr auto" gap="base" alignItems="center">
        <s-stack gap="small-300"><s-text type="strong">${esc(d.package.name)}</s-text>
          <s-text color="subdued">${esc(d.package.size)} · ${d.package.weight ? esc(d.package.weight) + " packed" : "weight not known yet"} · ${esc(d.package.source)}</s-text></s-stack>
        ${acts.has("package") && d.presets.length > 1 ? `<s-button commandFor="package-modal" command="--show">Change</s-button>` : ""}
      </s-grid></s-section>`;
  }

  // Customs
  const c = d.customs;
  const customsLine = c.state === "before_purchase"
    ? (c.expected || "")
    : (c.state === "electronic" ? `Electronic ✓${c.confirming ? " (CLIVE checks once more in a couple of minutes)" : ""}` : c.text);
  // A UK parcel has no customs (the Shipping section says so): no section for it.
  if (!d.domestic) main += `<s-section heading="Customs">
    <s-grid gridTemplateColumns="1fr auto" gap="base" alignItems="center">
      <s-stack gap="small-300">
        <s-text type="strong">${esc(customsLine)}</s-text>
        <s-text color="subdued">${esc(c.summary)}${c.incoterm ? " · " + esc(c.incoterm) : ""}</s-text>
        ${c.duties ? `<s-text color="subdued">${esc(c.duties)}</s-text>` : ""}
      </s-stack>
      <s-button commandFor="customs-modal" command="--show">Review</s-button>
    </s-grid></s-section>`;

  // Products
  if (!d.label && acts.has("refresh") && !d.domestic) {
    main += `<s-section heading="Edit product customs"><s-stack gap="base">${d.products.map((p,i) => `<s-stack gap="small-200"><s-text type="strong">${esc(p.title)} · ${esc(p.variant)}</s-text><s-grid gridTemplateColumns="1fr 1fr 2fr" gap="base"><s-text-field id="customs-${i}-hs" label="HS / commodity code" value="${esc(usedCode(`customs-${i}`, p.subject) || p.hs_code_value || '')}"></s-text-field><s-text-field id="customs-${i}-origin" label="Country of origin" value="${esc(p.origin || '')}"></s-text-field><s-text-field id="customs-${i}-desc" label="Customs description" value="${esc(p.description || '')}"></s-text-field></s-grid>${codeFinder(`customs-${i}`, p.subject, p.title)}<s-button data-action="edit-customs" data-line="${i}">Save product customs</s-button></s-stack>`).join('')}<s-text color="subdued">Saved through the product's existing Shopify customs and CLIVE knowledge records for future orders. Purchased declarations stay unchanged.</s-text></s-stack></s-section>`;
  }

  main += `<s-section heading="Products" padding="none"><s-table>
    <s-table-header-row><s-table-header listSlot="primary">Product</s-table-header>
      <s-table-header listSlot="labeled" format="numeric">Qty</s-table-header>
      <s-table-header listSlot="labeled">Value</s-table-header>
      <s-table-header listSlot="labeled">Weight</s-table-header></s-table-header-row>
    <s-table-body>${d.products.map((p) => `<s-table-row>
      <s-table-cell><s-stack gap="small-300"><s-text>${esc(p.title)}</s-text><s-text color="subdued">${esc(p.variant)}</s-text></s-stack></s-table-cell>
      <s-table-cell>${p.quantity}</s-table-cell><s-table-cell>${esc(p.unit_value)}</s-table-cell>
      <s-table-cell>${p.weight ? esc(p.weight) : '<s-badge tone="warning">Missing weight</s-badge>'}</s-table-cell>
    </s-table-row>`).join("")}</s-table-body></s-table></s-section>`;

  // Aside: address and history.
  const a = d.address;
  // Four separate facts, each from its own source: never one merged guess.
  const fact = (name, value, tone, note) => `<s-stack gap="small-500">
      <s-text color="subdued">${esc(name)}</s-text>
      <s-stack direction="inline" gap="small-200" alignItems="center"><s-badge tone="${esc(tone || "neutral")}">${esc(value)}</s-badge>${note ? `<s-text color="subdued">${esc(note)}</s-text>` : ""}</s-stack>
    </s-stack>`;
  const pr = d.print_status, car = d.carrier;
  const facts = `<s-section heading="Status">
      <s-stack gap="base">
        <s-text>${esc(d.stage_title || "")}</s-text>
        ${d.payment ? fact("Payment", d.payment.label, d.payment.tone, d.payment.note) : ""}
        ${d.fulfilment ? fact("Fulfilment", d.fulfilment.label, d.fulfilment.tone) : ""}
        ${d.label ? fact("Print", pr ? pr.label : "Not printed", pr ? pr.tone : "neutral") : ""}
        ${car ? fact("Carrier", car.label, car.tone, car.note || (car.checked_at ? `checked ${new Date(car.checked_at).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}` : "")) : ""}
        ${car ? `<s-button data-action="check-tracking">Check tracking</s-button>` : ""}
      </s-stack></s-section>`;
  const aside = facts + `<s-section heading="Ship to">
      <s-stack gap="small-200">
        ${a.lines.map((x) => `<s-text>${esc(x)}</s-text>`).join("")}
        <s-text>${flag(a.country)} ${esc(countryName(a.country))}</s-text>
        ${a.ok ? `<s-stack direction="inline" gap="small-200" alignItems="center"><s-icon type="check-circle" tone="success"></s-icon><s-text color="subdued">Address complete</s-text></s-stack>`
               : `<s-badge tone="critical">Address needs attention</s-badge>`}
        ${a.contact_note ? `<s-text color="subdued">${esc(a.contact_note)}</s-text>` : ""}
      </s-stack></s-section>
    <s-section heading="History">
      <s-stack gap="small-200">${d.timeline.slice(0, 12).map((e) =>
        `<s-stack gap="small-500"><s-text>${esc(e.what)}${e.verified ? " ✓" : ""}</s-text>
          ${e.note ? `<s-text>${esc(e.note)}</s-text>` : ""}
          <s-text color="subdued">${esc(shortTime(e.at))} · ${esc(e.who)}</s-text></s-stack>`).join("")}</s-stack>
    </s-section>`;

  page(d.order, slots, main + modals(d), aside);
}

function modals(d) {
  const sh = d.shipping;
  const services = `<s-modal id="services-modal" heading="All services for this parcel">
    <s-stack gap="base">${sh.options.map((o) => optionLine(o, o.roles.includes("recommended") ? "Recommended" : "", d.actions.includes("service"))).join("<s-divider></s-divider>")}</s-stack>
    <s-button slot="secondary-actions" commandFor="services-modal" command="--hide">Close</s-button>
  </s-modal>`;
  const pkg = `<s-modal id="package-modal" heading="Change package">
    <s-select id="package-choice" label="Package">
      ${d.presets.map((p) => `<s-option value="${esc(p.id)}" ${d.package && d.package.preset_id === p.id ? "selected" : ""}>${esc(p.name)} — ${esc(p.size)}</s-option>`).join("")}
    </s-select>
    <s-button slot="primary-action" variant="primary" data-action="package">Use this package</s-button>
    <s-button slot="secondary-actions" commandFor="package-modal" command="--hide">Cancel</s-button>
  </s-modal>`;
  const customs = `<s-modal id="customs-modal" heading="Customs details">
    <s-stack gap="base">${d.products.map((p) => `<s-stack gap="small-300">
      <s-text type="strong">${esc(p.title)} ${p.variant ? "· " + esc(p.variant) : ""} × ${p.quantity}</s-text>
      <s-text color="subdued">${esc(p.description)} · HS ${esc(p.hs_code || "missing")} · Made in ${esc(p.origin ? countryName(p.origin) : "missing")} · ${esc(p.unit_value)} each</s-text>
    </s-stack>`).join("<s-divider></s-divider>")}
    <s-paragraph color="subdued">These come from your products in Shopify, or from answers you saved here (also written to Shopify).</s-paragraph></s-stack>
    <s-button slot="secondary-actions" commandFor="customs-modal" command="--hide">Close</s-button>
  </s-modal>`;
  const pv = state.preview;
  const buy = `<s-modal id="buy-modal" heading="${d.buy_authorised ? "Buy this label?" : (pv && pv.price_known === false ? "Label preview (not bought)" : "Exact price (not bought)")}">
    ${pv ? `<s-stack gap="base">
      <s-unordered-list>${pv.will.map((w) => `<s-list-item>${esc(w)}</s-list-item>`).join("")}</s-unordered-list>
      <s-paragraph color="subdued">${esc(pv.charged || "")} A label is bought once, even if you click twice.</s-paragraph>
    </s-stack>
    ${d.buy_authorised
      ? `<s-button slot="primary-action" variant="primary" data-action="buy" id="buy-button">${pv.price ? `Buy label — ${esc(pv.price)}` : "Buy label"}</s-button>`
      : `<s-paragraph>Not bought: buying isn't authorised for this order yet.</s-paragraph>`}`
    : `<s-spinner accessibilityLabel="Checking the price"></s-spinner>`}
    <s-button slot="secondary-actions" commandFor="buy-modal" command="--hide">Cancel</s-button>
  </s-modal>`;
  const cancel = d.actions.includes("cancel_label") ? `<s-modal id="cancel-modal" heading="Cancel this label?">
    <s-stack gap="base">
      <s-paragraph>The label will be cancelled at ${esc(d.label ? d.label.provider || "the provider" : "the provider")} and can't be used to send the parcel. Any refund follows ${esc(d.label ? d.label.provider || "the provider" : "the provider")}'s rules.</s-paragraph>
      ${d.status.label === "Fulfilled" ? `<s-paragraph>Shopify still shows this order as fulfilled with the label's tracking: cancel that fulfilment in Shopify afterwards.</s-paragraph>` : ""}
    </s-stack>
    <s-button slot="primary-action" variant="primary" tone="critical" data-action="cancel-label">Cancel label</s-button>
    <s-button slot="secondary-actions" commandFor="cancel-modal" command="--hide">Keep label</s-button>
  </s-modal>` : "";
  return services + pkg + customs + buy + cancel;
}

const val = (id) => (document.getElementById(id)?.value ?? "").toString().trim();

async function withButton(el, fn) {
  if (state.busy) return;
  el?.setAttribute("loading", "");
  loading(true);
  try { await fn(); }
  catch (err) { state.flash = errorBanner(err); render(); }
  finally { el?.removeAttribute("loading"); loading(false); }
}

async function shipmentAction(path, body) {
  state.shipment = await api(`/shipments/${state.shipment.id}${path}`, { method: "POST", body });
  state.flash = null;
  renderShipment();
}

// Printing opens one window, synchronously in the click (so the browser allows it), before
// anything is recorded. The window shows each document with how many copies to print and on
// which printer; a single label opens straight in the PDF viewer.
function openPrintWindow() {
  const win = window.open("", "_blank");
  if (!win) {
    state.flash = { tone: "warning", heading: "Your browser blocked the print window",
      text: "Allow pop-ups for Shopify admin, then print again. Nothing was printed or recorded." };
    render();
  }
  return win;
}

async function fillPrintWindow(win, jobs) {
  const doc = win.document;
  doc.title = "Print · CLIVE Shipping";
  doc.body.style.cssText = "margin:16px;font:14px/1.4 -apple-system,system-ui,sans-serif";
  const headers = {};
  const t = await token();
  if (t) headers.Authorization = `Bearer ${t}`;
  const loaded = [];
  for (const job of jobs) {
    const res = await fetch(`${BASE}/admin/api/documents/${encodeURIComponent(job.artifact_id)}`, { headers });
    loaded.push({ job, url: res.ok ? URL.createObjectURL(await res.blob()) : null });
  }
  if (loaded.length === 1 && loaded[0].url && loaded[0].job.copies === 1) {
    win.location.href = loaded[0].url;  // one label: straight to the PDF viewer
    return;
  }
  const add = (tag, text, parent = doc.body) => {
    const el = doc.createElement(tag); el.textContent = text; parent.append(el); return el;
  };
  add("h1", `${loaded.length} document${loaded.length === 1 ? "" : "s"} to print`);
  for (const { job, url } of loaded) {
    const where = job.printer === "label" ? "the 4×6 label printer" : "the A4 printer";
    add("h2", `${job.order_name} — ${job.title}: print ${job.copies} cop${job.copies === 1 ? "y" : "ies"} on ${where}`);
    if (!url) { add("p", "This document couldn't be loaded. Print it again from the order."); continue; }
    const frame = doc.createElement("iframe");
    frame.src = url; frame.title = `${job.order_name} ${job.title}`;
    frame.style.cssText = "width:100%;height:80vh;border:1px solid #ccc";
    doc.body.append(frame);
  }
}

async function printJobs(path, win) {
  try {
    const out = await api(path, { method: "POST" });
    await fillPrintWindow(win, out.jobs);
    return out;
  } catch (err) {
    win.close();
    throw err;
  }
}

// Retain the same intent across network errors / reloads. A successful deliberate reprint
// clears its key; a later deliberate click creates one additional copy.
async function sendPhysical(path) {
  const storageKey = `crooks-print:${BASE}:${path}`;
  let key = sessionStorage.getItem(storageKey);
  if (!key) { key = crypto.randomUUID(); sessionStorage.setItem(storageKey, key); }
  const out = await api(path, { method: "POST", body: { idempotency_key: key } });
  if (out.print_intent.shipment_id) {
    sessionStorage.setItem(`crooks-last-print:${out.print_intent.shipment_id}`, out.print_intent.id);
  }
  // Uncertain keeps its key (a retry replays it); anything definite lets the next press try.
  if (out.outcome !== "unknown") sessionStorage.removeItem(storageKey);
  toast(out.message, ["failed", "unknown"].includes(out.outcome));
  return out;
}

// The parcel's way to the customer: each step with its time, then the carrier's own updates.
// Only what Shopify, the provider or the printer reported; nothing is guessed.
const shortTime = (at) => at ? new Date(at).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) : "";
function journeySection(d) {
  const j = d.journey;
  const look = {
    done: ["check-circle", "success", ""],
    next: ["clock", "info", ""],
    later: ["circle", "neutral", 'color="subdued"'],
    unrecorded: ["minus-circle", "neutral", 'color="subdued"'],
    unreported: ["minus-circle", "neutral", 'color="subdued"'],
  };
  const why = { unrecorded: "Not recorded here", unreported: "Not reported by the carrier" };
  const steps = j.steps.map((s) => {
    const [icon, tone, dim] = look[s.state] || look.later;
    const when = s.at ? shortTime(s.at) : (why[s.state] || (s.state === "next" ? "Next" : ""));
    return `<s-grid gridTemplateColumns="auto 1fr auto" gap="small-200" alignItems="center">
        <s-icon type="${icon}" tone="${tone}"></s-icon>
        <s-text ${dim}${s.state === "next" ? ' type="strong"' : ""}>${esc(s.title)}</s-text>
        <s-text color="subdued">${esc(when)}</s-text></s-grid>`;
  }).join("");
  const place = (e) => [e.city, e.country ? countryName(e.country) : ""].filter(Boolean).join(", ");
  const where = j.last_seen
    ? `Last seen in ${esc(place(j.last_seen))} · ${esc(shortTime(j.last_seen.at))} · going to ${flag(j.going_to)} ${esc(countryName(j.going_to))}`
    : `Going to ${flag(j.going_to)} ${esc(countryName(j.going_to))}`;
  const updates = j.events.length
    ? `<s-stack gap="small-200"><s-text type="strong">Carrier updates</s-text>${j.events.map((e) =>
        `<s-stack gap="small-500"><s-text>${esc(e.message || (e.status || "").replace(/_/g, " ").toLowerCase())}</s-text>
          <s-text color="subdued">${esc(shortTime(e.at))}${place(e) ? ` · ${esc(place(e))}` : ""}</s-text></s-stack>`).join("")}</s-stack>`
    : `<s-text color="subdued">No carrier updates yet. They appear here as ${esc(d.label?.carrier || "the carrier")} scans the parcel.</s-text>`;
  return `<s-section heading="Journey">
    <s-stack gap="base">
      ${j.problem ? `<s-banner tone="warning" heading="${esc(j.problem)}"></s-banner>` : ""}
      <s-text>${where}</s-text>
      <s-stack gap="small-200">${steps}</s-stack>
      ${j.note ? `<s-text color="subdued">${esc(j.note)}</s-text>` : ""}
      <s-divider></s-divider>
      ${updates}
    </s-stack></s-section>`;
}

// Finding a commodity code: plain words in, the UK Trade Tariff decides, the merchant confirms.
// A suggestion only fills the form; Save is the confirmation (and carries how it was found).
const finder = {};  // per form: { text, answers, result, used }
function codeFinder(target, subject, words) {
  // A form id repeats across orders: a different product starts a fresh look-up.
  if (!finder[target] || finder[target].subject !== subject) {
    finder[target] = { text: words, answers: {}, result: null, used: null, subject };
  }
  const f = finder[target];
  return `<s-stack gap="small-200">
    <s-grid gridTemplateColumns="1fr auto" gap="small-200" alignItems="end">
      <s-text-field id="${target}-find" label="Not sure of the code? Describe it" placeholder="e.g. jorts, men's cotton hoodie" value="${esc(f.text)}"></s-text-field>
      <s-button data-action="hs-find" data-target="${target}">Find the code</s-button>
    </s-grid>
    <s-box id="${target}-assist">${finderResult(target)}</s-box>
  </s-stack>`;
}
// A code chosen with "Use" stays in the form across redraws (until saved or started again).
const usedCode = (target, subject) => finder[target]?.subject === subject ? finder[target].used?.code : null;
function finderResult(target) {
  const r = finder[target]?.result;
  if (!r) return "";
  if (r.state === "question") {
    return `<s-stack gap="small-200"><s-text type="strong">${esc(r.question.text)}</s-text>
      <s-stack direction="inline" gap="small-200">${r.question.options.map((o) =>
        `<s-button data-action="hs-answer" data-target="${target}" data-fact="${esc(r.question.fact)}" data-value="${esc(o.value)}">${esc(o.label)}</s-button>`).join("")}</s-stack></s-stack>`;
  }
  if (r.state === "candidate") {
    const c = r.candidate;
    return `<s-box padding="base" border="base" borderRadius="base"><s-stack gap="small-200">
      <s-stack direction="inline" gap="small-200" alignItems="center"><s-text type="strong">${esc(c.spaced)}</s-text><s-badge tone="success">In the UK Trade Tariff</s-badge></s-stack>
      <s-text>${esc(c.path.join(" › "))}</s-text>
      ${c.reasons.length ? `<s-text color="subdued">Because: ${esc(c.reasons.join("; "))}</s-text>` : ""}
      <s-text color="subdued">Checked on the UK Trade Tariff ${esc(localTime(c.checked_at))}. Not saved until you save it.</s-text>
      <s-stack direction="inline" gap="small-200"><s-button data-action="hs-use" data-target="${target}">Use ${esc(c.spaced)}</s-button>
      <s-button variant="tertiary" data-action="hs-reset" data-target="${target}">Start again</s-button></s-stack>
    </s-stack></s-box>`;
  }
  return `<s-text color="subdued">${esc(r.message || "Enter the code by hand.")}</s-text>`;
}
function showFinder(target) {
  const box = document.getElementById(`${target}-assist`);
  if (box) box.innerHTML = finderResult(target);
}
// The evidence goes with Save only when the code saved is the one suggested.
function evidenceFor(target) {
  const u = finder[target]?.used;
  return u && val(`${target}-hs`).replace(/\D/g, "") === u.code ? u : { method: "manual" };
}
async function findCode(target) {
  const f = finder[target];
  f.text = val(`${target}-find`) || f.text;
  f.result = await api("/commodity/suggest", { method: "POST",
    body: { text: f.text, sid: state.shipment?.id, subject: f.subject, answers: f.answers } });
  showFinder(target);
}

// Print opens the label in the print view unless PrintNode is connected; then it is sent.
function printAction(d, reprint) {
  if (d.print_method !== "printnode") return "print-view";
  return reprint || d.print_status?.first_print_available === false ? "physical-reprint" : "physical-print";
}

function connectionLines(c) {
  if (!c) return "";
  if (c.method !== "printnode") {
    return `<s-text>Printing: print view</s-text><s-text color="subdued">${esc(c.detail)}</s-text>`;
  }
  const on = (v, good) => v ? `${esc(v)}${v === good ? "" : " ⚠"}` : "unknown";
  return `<s-stack direction="inline" gap="small-200" alignItems="center"><s-text>Printing: PrintNode</s-text>
      <s-badge tone="${c.ready ? "success" : "critical"}">${c.ready ? "Ready" : "Not ready"}</s-badge></s-stack>
    <s-text color="subdued">Printer ${esc(c.printer_name || "—")}: ${on(c.printer_state, "online")} · Computer ${esc(c.computer_name || "—")}: ${on(c.computer_state, "connected")}</s-text>
    ${c.ready ? "" : `<s-text color="subdued">${esc(c.detail || "")}</s-text>`}
    <s-text color="subdued">Checked ${esc(localTime(c.checked_at))}</s-text>`;
}

function printCard(d) {
  const p = d.print_status;
  if (!p) return "";
  const via = p.via ? ` · ${esc(p.via)}` : "";
  const say = {
    not_printed: d.print_method === "printnode" ? "Print label sends it to the printer." : "Print label opens it as a 4×6 PDF to print.",
    sending: "Sending to PrintNode…",
    printing: "PrintNode has it; waiting for the printer to finish.",
    printed: `Printed ${esc(localTime(p.printed_at))}${p.via === "print view" ? " (opened in the print view)" : " (the printer finished the job)"}.`,
    failed: `${esc(p.error || "The printer didn't print it.")}`,
    unknown: "Outcome uncertain: check the printer before choosing Reprint.",
    unconfirmed: "PrintNode never said the printer finished. Check the printer; Reprint if it didn't come out.",
  }[p.state] || "";
  const steps = (p.steps || []).map((x) =>
    `<s-text color="subdued">${esc(localTime(x.at))} · ${esc(x.words)}${x.message ? ` — ${esc(x.message)}` : ""}</s-text>`).join("");
  // International: the customs form (CN23) is part of the label file and prints with it.
  const label = (d.label?.documents || []).find((x) => x.kind === "shipping_label");
  const parcel = label && label.pages > 1
    ? `<s-text>${label.pages} labels go on this parcel: the shipping label and the customs form. Print prints both.</s-text>` : "";
  // Customs papers on A4 can't go through the 4×6 label printer: say so beside Print.
  const sheets = (d.label?.documents || []).filter((x) => x.must_print && x.kind !== "shipping_label");
  const also = sheets.length
    ? `<s-text>Also print ${sheets.map((x) => `${esc(x.title)} (${esc(x.page_size)}${x.copies > 1 ? `, ${x.copies} copies` : ""})`).join(" and ")} from Documents below, for the pouch on the parcel.</s-text>` : "";
  return `<s-stack gap="small-200"><s-heading>Label printing</s-heading>
    <s-stack direction="inline" gap="small-200" alignItems="center">${printBadge(p)}<s-text color="subdued">${via}</s-text></s-stack>
    <s-text>${say}</s-text>${parcel}${also}
    ${steps ? `<s-stack gap="small-100">${steps}</s-stack>` : ""}
    ${p.reprint_count ? `<s-text color="subdued">Reprints: ${p.reprint_count}</s-text>` : ""}
    ${d.print_method === "printnode" ? connectionLines(d.print_connection) : ""}
  </s-stack>`;
}

// The print view: a PDF in a new tab, as Shopify prints labels. The tab is opened in the click
// (so the browser allows it), then filled once the server has recorded the print.
async function openPdf(win, path, body) {
  const headers = {};
  const t = await token();
  if (t) headers.Authorization = `Bearer ${t}`;
  if (body) headers["Content-Type"] = "application/json";
  const res = await fetch(`${BASE}/admin/api${path}`, { method: "POST", headers, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) {
    win.close();
    let message = "The label couldn't be opened.";
    try { const j = await res.json(); message = j.detail?.message || j.detail || message; } catch { /* keep */ }
    throw new Error(message);
  }
  const note = decodeURIComponent(res.headers.get("X-Print-Note") || "");
  win.location.href = URL.createObjectURL(await res.blob());
  return { note, count: Number(res.headers.get("X-Print-Count") || 1) };
}

// After a PrintNode send: "Printing…" until PrintNode says done or failed (a minute at most;
// after that the server's own check carries on).
async function watchPrint(intentId) {
  for (let i = 0; i < 30; i++) {
    await new Promise((r) => setTimeout(r, 2000));
    const out = await api(`/print/intents/${encodeURIComponent(intentId)}`);
    if (state.shipment) {
      state.shipment = await api(`/shipments/${state.shipment.id}`);
      if (new URLSearchParams(location.search).get("shipment") === state.shipment.id) renderShipment();
    }
    if (!["printing", "sending"].includes(out.outcome)) {
      toast(out.message, out.outcome !== "printed");
      return out;
    }
  }
  return null;
}

const ACTIONS = {
  "hs-find": (el) => withButton(el, async () => {
    const f = finder[el.dataset.target]; f.answers = {}; f.used = null;
    await findCode(el.dataset.target);
  }),
  "hs-answer": (el) => withButton(el, async () => {
    finder[el.dataset.target].answers[el.dataset.fact] = el.dataset.value;
    await findCode(el.dataset.target);
  }),
  "hs-use": (el) => {
    const t = el.dataset.target, c = finder[t].result.candidate;
    const hs = document.getElementById(`${t}-hs`);  // the description stays the merchant's words
    if (hs) hs.value = c.code;
    finder[t].used = { method: "suggested", code: c.code, inputs: c.inputs, reasons: c.reasons };
    toast(`${c.spaced} is in the form. Save to confirm it.`);
  },
  "hs-reset": (el) => { const f = finder[el.dataset.target]; f.answers = {}; f.result = null; f.used = null; showFinder(el.dataset.target); },
  // "Select all ready" asks the server again: what may be bought (or printed) now, for this tab
  // and search, never what the page showed earlier. The review re-checks each one once more.
  'select-stage': el => withButton(el, async () => {
    state.inbox = await loadInbox();
    const pick = bulkPick(state.inbox);
    state.selected.clear();
    if (pick) visibleInboxRows().filter(r => r[pick.flag]).slice(0, PICK_MAX).forEach(r => state.selected.add(r.id));
    renderInbox();
  }),
  'clear-selection': () => {state.selected.clear(); refreshSelection();},
  'bulk-buy': el => withButton(el, () => reviewSelected('buy')),
  'bulk-print': el => {
    if (state.inbox.print_method === 'printnode') return withButton(el, () => reviewSelected('print'));
    const ids = visibleInboxRows().filter(r => state.selected.has(r.id)).map(r => r.id);
    if (!ids.length || state.busy) return;
    const win = openPrintWindow();
    if (!win) return;
    return withButton(el, async () => {
      const out = await openPdf(win, '/print-view', { shipment_ids: ids });
      toast(`${out.count} label${out.count === 1 ? '' : 's'} opened to print${out.note ? `. ${out.note}` : ''}`, Boolean(out.note));
      state.selected.clear();
      state.inbox = await loadInbox(); renderInbox();
    });
  },
  'confirm-batch': el => withButton(el, async () => {
    state.batch = await api(`/batches/${state.batch.id}/confirm`, {method:'POST', body:{confirm:true}}); renderBatch();
  }),
  'edit-customs': el => withButton(el, async () => {
    const i = Number(el.dataset.line); const p = state.shipment.products[i];
    await shipmentAction('/customs', {subject:p.subject, hs_code:val(`customs-${i}-hs`), origin:val(`customs-${i}-origin`).toUpperCase(), description:val(`customs-${i}-desc`), classification: evidenceFor(`customs-${i}`)});
  }),
  async "print-status"(el) {
    await withButton(el, async () => {
      const id = state.shipment.print_status.intent_id;
      const out = await api(`/print/intents/${encodeURIComponent(id)}`);
      state.shipment = await api(`/shipments/${state.shipment.id}`);
      renderShipment();
      toast(out.message, ["failed", "unknown"].includes(out.outcome));
    });
  },
  async "print-view"(el) {
    if (state.busy) return;
    const win = openPrintWindow();
    if (!win) return;
    await withButton(el, async () => {
      const out = await openPdf(win, `/shipments/${state.shipment.id}/print-view`);
      if (out.note) toast(out.note);
      state.shipment = await api(`/shipments/${state.shipment.id}`);
      renderShipment();
    });
  },
  async "physical-print"(el) {
    let out;
    await withButton(el, async () => {
      out = await sendPhysical(`/shipments/${state.shipment.id}/print-label`);
      state.shipment = await api(`/shipments/${state.shipment.id}`);
      renderShipment();
    });
    if (out && ["printing", "sending"].includes(out.outcome)) await watchPrint(out.print_intent.id);
  },
  async "physical-reprint"(el) {
    if (!window.confirm("Send one additional copy of this existing label? Check any uncertain output first.")) return;
    let out;
    await withButton(el, async () => {
      out = await sendPhysical(`/shipments/${state.shipment.id}/reprint-label`);
      state.shipment = await api(`/shipments/${state.shipment.id}`); renderShipment();
    });
    if (out && ["printing", "sending"].includes(out.outcome)) await watchPrint(out.print_intent.id);
  },
  async "printer-test"(el) {
    await withButton(el, () => sendPhysical("/print/test"));
  },
  "go-inbox": () => navigate({ ...(state.inbox ? { stage: state.inbox.stage } : {}), ...(state.q ? { q: state.q } : {}) }),
  async "check-tracking"(el) {
    // A read of Shopify's carrier tracking: never buys or prints.
    await withButton(el, async () => {
      state.shipment = await api(`/shipments/${state.shipment.id}/tracking`, { method: "POST" });
      renderShipment();
    });
  },
  "go-setup": () => navigate({ view: "setup" }),
  async sync(el) {
    await withButton(el, async () => {
      const out = await api("/sync", { method: "POST" });
      toast(`Checked Shopify: ${out.open} open international order${out.open === 1 ? "" : "s"}`);
      state.inbox = await loadInbox();
      renderInbox();
    });
  },
  async "print-ready"(el) {
    const win = openPrintWindow();
    if (!win) return;
    await withButton(el, async () => {
      const out = await printJobs("/print/ready", win);
      state.inbox = await loadInbox();
      if (out.skipped.length) {
        state.flash = { tone: "warning",
          heading: `${out.labels} of ${out.labels + out.skipped.length} labels opened to print`,
          text: out.skipped.map((x) => `${x.order}: ${x.reason}`).join(" ") };
      }
      renderInbox();
      if (!out.skipped.length) toast(`${out.labels} label${out.labels === 1 ? "" : "s"} opened to print`);
    });
  },
  async refresh(el) {
    await withButton(el, async () => {
      state.preview = null;
      await shipmentAction("/refresh");
      toast("Refreshed from Shopify");
    });
  },
  async answer(el) {
    const i = Number(el.dataset.q);
    const q = state.shipment.questions[i];
    const id = `q${i}`;
    let value = {};
    if (q.kind === "customs") value = { hs_code: val(`${id}-hs`), description: val(`${id}-desc`), classification: evidenceFor(id) };
    else if (q.kind === "origin") value = { country: val(`${id}-country`) };
    else if (q.kind === "weight") value = { grams: Number(val(`${id}-grams`)) };
    else if (q.kind === "package") value = { name: val(`${id}-name`), length_cm: Number(val(`${id}-l`)),
      width_cm: Number(val(`${id}-w`)), height_cm: Number(val(`${id}-h`)), empty_weight_g: Number(val(`${id}-g`)) };
    else if (q.kind === "second_label") value = { confirm: true };
    else if (q.kind === "domestic_service") value = { service: el.dataset.service };
    else if (q.kind === "label_check") value = { confirm: true };
    await withButton(el, async () => {
      await shipmentAction("/answer", { kind: q.kind, subject: q.subject, value });
      toast(q.kind === "second_label" ? "Confirmed: a second parcel. Check the price before buying."
        : q.kind === "domestic_service" ? "Service saved for this order."
        : q.kind === "label_check" ? "Noted: no label in Shopify. Check the order before buying."
        : "Saved. CLIVE won't ask again for this product.");
    });
  },
  "use-suggestion"(el) {
    const i = Number(el.dataset.q);
    const f = document.getElementById(`q${i}-hs`);
    if (f) f.value = state.shipment.questions[i].suggestion;
  },
  async choose(el) {
    await withButton(el, async () => {
      hideModal("services-modal");
      state.preview = null;
      await shipmentAction("/service", { service_code: el.dataset.code });
    });
  },
  async package(el) {
    await withButton(el, async () => {
      hideModal("package-modal");
      state.preview = null;
      await shipmentAction("/package", { preset_id: val("package-choice") });
    });
  },
  async preview(el) {
    await withButton(el, async () => {
      state.preview = null;
      const pv = await api(`/shipments/${state.shipment.id}/preview`, { method: "POST" });
      state.preview = pv;
      state.buyKey = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/-/g, "");
      state.shipment = pv.shipment;
      renderShipment();
      showModal("buy-modal");
    });
  },
  async buy(el) {
    if (!state.preview) return;
    el.setAttribute("disabled", "");
    await withButton(el, async () => {
      try {
        const out = await api(`/shipments/${state.shipment.id}/buy`,
          { method: "POST", body: { basis: state.preview.basis, idempotency_key: state.buyKey } });
        hideModal("buy-modal");
        state.preview = null; state.buyKey = null;
        state.shipment = out.shipment;
        renderShipment();
        if (out.charged) toast(out.replayed ? "Already bought: showing that label" : "Label purchased");
        else if (out.may_have_been_charged) toast(`Checking with ${out.shipment?.provider || "the provider"} whether it was paid`, true);
      } catch (err) {
        hideModal("buy-modal");
        if (!certainlyNotBought(err)) {
          // No clear answer (dropped connection, a proxy error, a restart): the label may have
          // been bought. The same key replays, never buys twice. Offer exactly that.
          state.flash = { tone: "warning", heading: "The label may have been bought",
            text: "CLIVE didn't give a clear answer. Check again: it repeats the same request, so you can't be charged twice.",
            action: "buy-again", actionLabel: "Check again" };
          render();
          return;
        }
        state.preview = null; state.buyKey = null;
        throw err;
      }
    });
  },
  async "buy-again"(el) {
    await withButton(el, async () => {
      const out = await api(`/shipments/${state.shipment.id}/buy`,
        { method: "POST", body: { basis: state.preview.basis, idempotency_key: state.buyKey } });
      state.preview = null; state.buyKey = null; state.flash = null;
      state.shipment = out.shipment;
      renderShipment();
    });
  },
  async "cancel-label"(el) {
    await withButton(el, async () => {
      hideModal("cancel-modal");
      await shipmentAction("/cancel-label", { confirm: true });
      toast(state.shipment.status.label);
    });
  },
  async "retry-shopify"(el) {
    await withButton(el, async () => {
      await shipmentAction("/retry-shopify");
      toast(state.shipment.status.label === "Fulfilled" ? "Shopify updated" : "Shopify still didn't accept it", state.shipment.status.label !== "Fulfilled");
    });
  },
  async print(el) {
    const win = openPrintWindow();
    if (!win) return;
    await withButton(el, async () => {
      const out = await printJobs(`/shipments/${state.shipment.id}/print`, win);
      state.shipment = out.shipment;
      renderShipment();
    });
  },
  async "open-doc"(el) {
    // Viewing one stored document; not recorded as a print.
    const win = openPrintWindow();
    if (!win) return;
    const doc = state.shipment.label.documents.find((x) => x.artifact_id === el.dataset.doc);
    await withButton(el, () => fillPrintWindow(win, [{ artifact_id: el.dataset.doc,
      order_name: state.shipment.order, title: doc ? doc.title : "Document",
      copies: doc && doc.copies > 1 ? doc.copies : 1, printer: doc && doc.page_size === "4x6" ? "label" : "document" }]));
  },
  async "save-setup"(el) {
    const origin = { ...(state.setup.origin || {}) };
    for (const k of ["name", "company", "line1", "line2", "city", "postcode", "phone", "email"]) origin[k] = val(`o-${k}`);
    const body = { origin, ioss_number: val("c-ioss"), eori_number: val("c-eori"), vat_number: val("c-vat"),
      notify_customer: !!document.getElementById("c-notify")?.checked };
    await withButton(el, async () => {
      state.setup = await api("/setup", { method: "POST", body });
      state.flash = null; renderSetup(); toast("Setup saved");
    });
  },
  async "add-package"(el) {
    const body = { name: val("np-name"), length_cm: Number(val("np-l")), width_cm: Number(val("np-w")),
      height_cm: Number(val("np-h")), empty_weight_g: Number(val("np-g")), make_default: !state.setup.presets.length };
    await withButton(el, async () => {
      state.setup = await api("/setup/packages", { method: "POST", body });
      state.flash = null; renderSetup(); toast("Package added");
    });
  },
  async "make-default"(el) {
    await withButton(el, async () => {
      state.setup = await api("/setup", { method: "POST", body: { default_package_id: el.dataset.id } });
      renderSetup();
    });
  },
};

document.addEventListener("click", (ev) => {
  const open = ev.target.closest("[data-open]");
  if (open) { ev.preventDefault(); navigate({ shipment: open.dataset.open }); return; }
  const tab = ev.target.closest("[data-stage]");
  if (tab) {
    // A stage is a view of the same orders: selections never carry across it.
    ev.preventDefault(); state.selected.clear();
    navigate(state.q ? { stage: tab.dataset.stage, q: state.q } : { stage: tab.dataset.stage });
    return;
  }
  const el = ev.target.closest("[data-action]");
  if (!el || el.hasAttribute("disabled")) return;
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  ev.preventDefault();
  fn(el);
});

let searchTimer = null;
document.addEventListener("input", (ev) => {
  if (ev.target.id !== "search") return;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    state.q = ev.target.value || "";
    try { state.inbox = await loadInbox(); renderInbox(); keepSearchInUrl();
      const f = document.getElementById("search"); f?.focus?.(); }
    catch (err) { state.flash = errorBanner(err); render(); }
  }, 250);
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "stage-select") {
    state.selected.clear();
    const stage = ev.target.value || "attention";
    navigate(state.q ? { stage, q: state.q } : { stage });
    return;
  }
  if (ev.target.id === "pick-all") {
    const pick = bulkPick(state.inbox);
    const eligible = visibleInboxRows().filter((r) => pick && r[pick.flag]);
    // Like Shopify: none → all (up to the limit); some or all → none.
    if (ev.target.checked && !pickedState(eligible).chosen) eligible.slice(0, PICK_MAX).forEach((r) => state.selected.add(r.id));
    else state.selected.clear();
    refreshSelection(); return;
  }
  if (ev.target.dataset?.select) {
    const id = ev.target.dataset.select;
    if (ev.target.checked && state.selected.size >= PICK_MAX) ev.target.checked = false;  // the bar says the limit
    else if (ev.target.checked) state.selected.add(id); else state.selected.delete(id);
    refreshSelection(); return;
  }
});
// Read the state recovered by the server tick; never submit quotes or a purchase here.
let quoteRecoveryPending = false;
async function refreshQuoteRecovery() {
  const sid = new URLSearchParams(location.search).get("shipment");
  const before = state.shipment;
  if (!sid || before?.id !== sid || before.label || state.busy || state.preview ||
      quoteFormDirty || quoteRecoveryPending || document.hidden) return;
  quoteRecoveryPending = true;
  try {
    const fresh = await api(`/shipments/${encodeURIComponent(sid)}`);
    if (new URLSearchParams(location.search).get("shipment") !== sid ||
        state.shipment !== before || state.busy || state.preview || quoteFormDirty) return;
    const changed = JSON.stringify([fresh.shipping, fresh.status, fresh.label]) !==
                    JSON.stringify([before.shipping, before.status, before.label]);
    state.shipment = fresh;
    if (changed) renderShipment();
  } catch (_) { /* Keep the current explanation; the next read can recover. */ }
  finally { quoteRecoveryPending = false; }
}
document.addEventListener("input", ev => {
  if (ev.target.id !== "search") quoteFormDirty = true;
});
document.addEventListener("change", ev => {
  if (ev.target.id !== "group") quoteFormDirty = true;
});
setInterval(() => { void refreshQuoteRecovery(); }, 20000);

window.addEventListener("popstate", () => route());
route();
</script>
